name: reveil
description: "Réveil : dire une heure pour régler l'alarme du téléphone."
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  # Composants Material 3 (et leurs libellés en français).
  material_ui: ^1.1.0
  # Reconnaissance vocale Android.
  speech_to_text: ^7.5.0
  # llama.cpp embarqué : petit modèle local de secours pour la compréhension.
  llamadart: ^0.19.11

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

# N'embarquer que le moteur llama.cpp (modèles GGUF).
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
