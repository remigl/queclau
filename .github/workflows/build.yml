name: Build

# Compile les APK à chaque push sur main.
# Si la version de pubspec.yaml (ex. 1.0.0) n'a pas encore de release GitHub,
# la release « v1.0.0 » est créée avec les APK.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Dépendances
        shell: bash
        run: |
          set -o pipefail
          { flutter --version && flutter pub get; } 2>&1 | tee -a ci.log

      - name: Analyse
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a ci.log

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee -a ci.log

      # Variante légère : parser déterministe seul.
      - name: Build APK sans modèle
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee -a ci.log
          cp build/app/outputs/flutter-apk/app-release.apk reveil-sans-modele.apk

      # Variante complète : modèle de langage local embarqué.
      - name: Build APK avec modèle
        shell: bash
        run: |
          set -o pipefail
          tool/fetch_model.sh 2>&1 | tee -a ci.log
          flutter build apk --release --target-platform android-arm64 2>&1 | tee -a ci.log
          cp build/app/outputs/flutter-apk/app-release.apk reveil.apk
          ls -la *.apk | tee -a ci.log
          unzip -l reveil.apk | grep -E "\.gguf|\.so$" | tee -a ci.log

      # Publie une release quand la version de pubspec.yaml n'en a pas encore.
      - name: Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "La release $tag existe déjà."
            exit 0
          fi
          full="reveil-${tag}.apk"
          light="reveil-${tag}-sans-modele.apk"
          mv reveil.apk "$full"
          mv reveil-sans-modele.apk "$light"
          gh release create "$tag" "$full" "$light" \
            --target "$GITHUB_SHA" \
            --title "Réveil ${tag}" \
            --notes-file RELEASE_NOTES.md
