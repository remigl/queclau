name: Build

# Compile l'APK à chaque push sur main.
# Un tag « v* » (ex. v1.0.0) publie en plus une release GitHub avec l'APK.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Dépendances
        shell: bash
        run: |
          set -o pipefail
          { flutter --version && flutter pub get; } 2>&1 | tee -a ci.log

      - name: Analyse
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a ci.log

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee -a ci.log

      # Variante légère : parser déterministe seul.
      - name: Build APK sans modèle
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee -a ci.log
          cp build/app/outputs/flutter-apk/app-release.apk reveil-sans-modele.apk

      # Variante complète : modèle de langage local embarqué.
      - name: Build APK avec modèle
        shell: bash
        run: |
          set -o pipefail
          tool/fetch_model.sh 2>&1 | tee -a ci.log
          flutter build apk --release --target-platform android-arm64 2>&1 | tee -a ci.log
          cp build/app/outputs/flutter-apk/app-release.apk reveil.apk
          ls -la *.apk | tee -a ci.log
          unzip -l reveil.apk | grep -E "\.gguf|\.so$" | tee -a ci.log

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          full="reveil-${GITHUB_REF_NAME}.apk"
          light="reveil-${GITHUB_REF_NAME}-sans-modele.apk"
          mv reveil.apk "$full"
          mv reveil-sans-modele.apk "$light"
          gh release create "$GITHUB_REF_NAME" "$full" "$light" \
            --title "Réveil ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
