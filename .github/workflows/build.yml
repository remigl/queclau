name: Build

# Compile l'APK (avec le modèle de langage) à chaque push sur main.
# Si la version de pubspec.yaml (ex. 1.0.0) n'a pas encore de release GitHub,
# la release « v1.0.0 » est créée avec l'APK.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Dépendances
        shell: bash
        run: |
          set -o pipefail
          { flutter --version && flutter pub get; } 2>&1 | tee -a ci.log

      - name: Analyse
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a ci.log

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee -a ci.log

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          tool/fetch_model.sh 2>&1 | tee -a ci.log
          flutter build apk --release --target-platform android-arm64 2>&1 | tee -a ci.log
          cp build/app/outputs/flutter-apk/app-release.apk reveil.apk
          ls -la reveil.apk | tee -a ci.log

      # Publie une release quand la version de pubspec.yaml n'en a pas encore.
      - name: Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "La release $tag existe déjà."
            exit 0
          fi
          apk="reveil-${tag}.apk"
          mv reveil.apk "$apk"
          gh release create "$tag" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Réveil ${tag}" \
            --notes-file RELEASE_NOTES.md

      # En cas d'échec, le journal du build est poussé sur la branche ci-logs.
      - name: Journal d'échec
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs
          tail -n 600 ci.log > /tmp/logs/ci.log 2>/dev/null || true
          echo "failure ${GITHUB_SHA} run ${GITHUB_RUN_ID}" > /tmp/logs/status.txt
          cd /tmp/logs
          git init -q -b ci-logs
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Journal ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" ci-logs
